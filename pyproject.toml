[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zspace-cli"
version = "0.1.0"
description = "极空间 (ZSpace NAS) 命令行工具与全量 2,004 接口动态调用引擎"
readme = "docs/auth_and_protocol.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
zs = "zspace_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zspace_cli = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
